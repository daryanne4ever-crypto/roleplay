<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ING & Connect Quest | Professional Edition</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">EQ</div>
      <button class="nav-btn active" data-mode="all">All Challenges</button>
      <button class="nav-btn" data-mode="gerund">Gerund</button>
      <button class="nav-btn" data-mode="infinitive">Infinitive</button>
      <button class="nav-btn" data-mode="connector">Connectors</button>

      <div class="progress-info">
        <span>Total Progress</span>
        <div class="mini-bar"><div id="total-progress-fill"></div></div>
      </div>
    </nav>

    <main class="game-area">
      <section class="card" id="game-card">
        <header class="card-header">
          <span id="category-tag">GERUND</span>
          <span id="question-tag">Question 1 / 80</span>
          <div id="lives" class="lives">❤️❤️❤️</div>
        </header>

        <section class="stats-row">
          <p>Score: <b id="score">0</b></p>
          <p>Time: <b id="timer">15</b>s</p>
        </section>

        <div class="progress-bar"><div id="progress"></div></div>

        <section class="question-box">
          <button id="play-btn" class="circle-btn" aria-label="Play audio">🔊</button>
          <h2 id="sentence-text" class="blur">Click the eye button to reveal sentence</h2>
          <button id="toggle-text" class="eye-btn" aria-label="Show sentence">👁️</button>
        </section>

        <div id="sentence-display" class="hidden sentence-panel"></div>

        <section id="options-container" class="options-grid" aria-label="Answer options"></section>

        <section class="voice-section">
          <button id="mic-btn" class="mic-inactive">🎤 Start recording</button>
          <p id="transcript">Waiting for your voice...</p>
        </section>

        <section id="feedback-panel" class="feedback-panel hidden">
          <h3 id="feedback-title"></h3>
          <p id="feedback-suggestion"></p>
          <button id="next-btn" class="next-btn">Continue</button>
        </section>

        <footer class="card-footer">
          <button id="hint-btn" class="hint-trigger">💡 Show hint (-5 pts)</button>

          <div class="auntie-box">
            <div id="auntie-mood" class="auntie-avatar">🧠</div>
            <p id="auntie-line">Auntie says: Listen first, then answer.</p>
          </div>
        </footer>
      </section>

      <aside id="ranking-section" class="ranking-card">
        <h3>Class Ranking</h3>
        <ol id="leaderboard"></ol>
      </aside>
    </main>

    <script src="data/phrases.js"></script>
    <script src="game.js"></script>
  </body>
</html>
